site_name: django-spec-agents
site_description: Pydantic-AI agents for Django - a settings-agnostic agent host, and specs as agent tools behind the [specs] extra.
site_url: https://artui.github.io/django-spec-agents/
repo_url: https://github.com/Artui/django-spec-agents
repo_name: Artui/django-spec-agents
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # ``spec_tools``' docstrings link to symbols the kernel documents
          # (``PoolSeeds``, ``ServerArguments``, ``DispatchResult`` and
          # ``DEFAULT_PAGE_SIZE``). Those links resolve in the kernel's inventory, not ours, so
          # without it the strict build aborts on cross-reference targets it
          # cannot find -- and a reader following one would have nowhere to
          # land. Importing the inventory makes them point at the kernel's page.
          inventories:
            - https://artui.github.io/django-service-specs/objects.inv
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Agent host:
      - Concepts: concepts.md
      - Tools: tools.md
      - Storage: storage.md
      - Policy: policy.md
      - Integrations: integrations.md
      - Reference:
          - reference/index.md
          - Agent: reference/agent.md
          - Registry: reference/registry.md
          - Persistence: reference/persistence.md
          - Policy: reference/policy.md
          - Integrations: reference/integrations.md
  - Spec tools:
      - spec-tools/index.md
      - Quickstart: spec-tools/quickstart.md
      - Shared spec registry: spec-tools/spec-registry.md
      - Hide plumbing from the model: spec-tools/agent-audience.md
      - Running from a worker: spec-tools/background-runs.md
      - Reference: spec-tools/reference.md
